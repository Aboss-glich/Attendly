<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
    <title>Attendly | Sign in</title>
<style>.password-wrap{position:relative;display:flex;align-items:center}.password-wrap input{width:100%;padding-right:48px}.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;cursor:pointer;border-radius:10px;font-size:18px}.password-toggle:hover{background:rgba(30,64,175,.08)}</style></head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel">
            <div class="brand login-brand"><span class="brand-mark">A</span><span>attendly</span></div>
            <p class="eyebrow">SCHOOL ATTENDANCE WORKSPACE</p>
            <h1>Welcome back</h1>
            <p class="login-lead">Sign in to manage attendance, students, and reports.</p>
            <form id="loginForm">
                <label>Username<input id="username" autocomplete="username" required autofocus></label>
                <label>Password<div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required><button class="password-toggle" id="togglePassword" type="button" aria-label="Show password" aria-pressed="false">👁️</button></div></label>
                <p class="login-error" id="loginError" role="alert"></p>
                <button class="primary-button login-button" type="submit">Sign in <span>→</span></button>
            </form>
            <a class="forgot-link" href="forgot-password.html">Forgot password?</a>
        </section>
    </main>
</body>
</html>
