<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style.css"><script src="forgot-password.js" defer></script><title>Attendly | Password recovery</title></head>
<body class="login-page"><main class="login-shell"><section class="login-panel"><div class="brand login-brand"><span class="brand-mark">A</span><span>attendly</span></div><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Reset password</h1><p class="login-lead">Verify your username and registered recovery email, then choose a new password.</p><form id="forgotForm"><label>Username<input id="forgotUsername" required autocomplete="username"></label><label>Recovery email<input id="forgotEmail" type="email" required autocomplete="email"></label><label>New password<input id="forgotPassword" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirm password<input id="forgotConfirm" type="password" minlength="8" required autocomplete="new-password"></label><p class="login-error" id="forgotMessage" role="status"></p><button class="primary-button login-button" type="submit">Reset password</button></form><a class="forgot-link" href="login.html">Back to sign in</a></section></main></body>
</html>
