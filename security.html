<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Security Center</title><link rel="stylesheet" href="style.css"><style>main{max-width:1100px;margin:40px auto;padding:0 20px}.hero,.card{background:#fff;border:1px solid #e6e9ef;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 8px 30px rgba(0,0,0,.04)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{padding:18px;border-radius:14px;background:#f6f8fb}.stat b{font-size:26px;display:block}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;font-size:14px}button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer}</style></head><body><main><a href="dashboard.html">← Dashboard</a><section class="hero"><h1>🛡️ Owner Security Center</h1><p>Protected owner-only area. Review activity and security status.</p></section><section class="grid"><div class="stat"><b id="events">—</b>Recent events</div><div class="stat"><b>8h</b>Session expiry</div><div class="stat"><b>6</b>Max failed logins</div><div class="stat"><b>Strict</b>Cookie policy</div></section><section class="card"><h2>Security audit log</h2><button id="refresh">Refresh</button><table><thead><tr><th>Time</th><th>Account</th><th>Action</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></section></main><script src="app-common.js"></script><script src="security.js"></script></body></html>
